server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 26m;

    # The pdf.js worker is an .mjs module; browsers refuse modules served as octet-stream
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    # Re-resolve core-api through Docker's DNS, so a restarted API container (new IP) is found
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_api http://core-api:8080;

    location /api/ {
        proxy_pass $core_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-Sent Events: pass each token through immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
